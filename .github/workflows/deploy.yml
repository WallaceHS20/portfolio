name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]

  # Permite executar manualmente pela aba Actions do GitHub
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy por vez para evitar conflitos
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonando o código do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurando o ambiente Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Instalando dependências do projeto
        run: npm ci

      - name: 🔨 Gerando a build de produção com Vite
        run: npm run build

      - name: 🌐 Preparando ambiente do GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Compactando artefatos da pasta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: 🚀 Publicando aplicação no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🎉 Notificação de Sucesso!
        if: success()
        run: |
          echo "========================================================"
          echo "🎉 DEPLOY REALIZADO COM SUCESSO!"
          echo "✨ O seu portfólio já está online e atualizado."
          echo "🔗 Acesse em: ${{ steps.deployment.outputs.page_url }}"
          echo "========================================================"