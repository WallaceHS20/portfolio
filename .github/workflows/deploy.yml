name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]

  # Permite executar manualmente pela aba Actions do GitHub
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy por vez para evitar conflitos
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Gerar Build do Vite
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dos Artefatos (pasta dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
